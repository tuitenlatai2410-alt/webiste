/* Bật chế độ JS + màn chào mừng 1 lần mỗi phiên, tối đa 1 giây; tắt hẳn khi máy bật giảm chuyển động */
(function(d){var c=d.documentElement,show=true;c.className=c.className.replace('no-js','js');
try{show=!sessionStorage.getItem('qnf-intro')}catch(e){}

if(show)c.classList.add('intro-on')})(document);
